services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: us_agent
      POSTGRES_USER: us_agent
      POSTGRES_PASSWORD: us_agent_local
    ports:
      - "5432:5432"
    volumes:
      - us_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U us_agent -d us_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  us_agent_postgres:
